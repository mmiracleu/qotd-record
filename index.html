<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miracle Talk Talk</title>
<style>
  :root {
    --miracle-blue: #AED6F1;
    --miracle-blue-deep: #5DADE2;
    --ink: #2C3E50;
    --paper: #FBFCFD;
    --accent: #F7B733;
    --red: #E74C3C;
    --green: #2ECC71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--miracle-blue) 0%, #EAF4FB 55%, var(--paper) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    color: var(--ink);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 620px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(93, 173, 226, 0.25);
    padding: 32px 30px;
    position: relative;
  }
  .logo { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto 8px; }
  h2 { text-align: center; margin: 0 0 20px; font-size: 20px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; text-align: center; padding: 12px 8px; border-radius: 14px;
    background: #F0F6FB; color: #7f8c9a; font-weight: 700; cursor: pointer;
    border: 2px solid transparent; transition: all .15s;
  }
  .tab.active { background: var(--miracle-blue); color: var(--ink); border-color: var(--miracle-blue-deep); }

  .qbox {
    background: #FFF6E0; border-radius: 16px; padding: 16px 18px; margin-bottom: 18px;
    display: none;
  }
  .qbox.show { display: block; }
  .qbox .tag { font-size: 12px; font-weight: 700; color: #B8860B; margin-bottom: 4px; }
  .qbox .q { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .qbox .qkr { font-size: 13px; color: #9a8664; margin-top: 4px; }
  .qbox .qex {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid #F0E2C0;
    font-size: 14px; line-height: 1.65; color: #5c4a2e;
  }
  .qbox .qex b, .qbox .qshort b {
    display: block; font-size: 11px; font-weight: 700; color: #B8860B;
    letter-spacing: 0.04em; margin-bottom: 3px;
  }
  .qbox .qshort { margin-top: 8px; font-size: 12px; color: #9a8664; }
  .qbox .qshort b { display: block; }

  label { display: block; font-size: 13px; color: #7f8c9a; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #E3EDF3;
    font-size: 16px; margin-bottom: 20px;
  }
  input[type=text]:focus { outline: none; border-color: var(--miracle-blue-deep); }

  .recorder { text-align: center; }
  .rec-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: var(--red); color: #fff; font-size: 34px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(231,76,60,0.35); transition: transform .1s;
  }
  .rec-btn:active { transform: scale(0.96); }
  .rec-btn.recording { background: #C0392B; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(231,76,60,.5);} 70%{box-shadow:0 0 0 18px rgba(231,76,60,0);} 100%{box-shadow:0 0 0 0 rgba(231,76,60,0);} }
  .timer { font-size: 22px; font-weight: 700; margin: 14px 0; color: var(--ink); }
  .hint { font-size: 13px; color: #9aa7b2; margin-bottom: 6px; }

  audio { width: 100%; margin: 16px 0; display: none; }

  .submit-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: var(--miracle-blue-deep); color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; display: none; margin-top: 4px;
  }
  .submit-btn:disabled { opacity: 0.5; }

  .retry-btn {
    width: 100%; padding: 12px; border-radius: 14px;
    border: 2px solid var(--miracle-blue); background: #fff;
    color: var(--miracle-blue-deep); font-size: 15px; font-weight: 700;
    cursor: pointer; display: none; margin-top: 8px;
  }
  .retry-btn:active { transform: scale(0.98); }

  .status { text-align: center; margin-top: 16px; font-size: 14px; min-height: 20px; }
  .status.ok { color: #27AE60; font-weight: 700; }
  .status.err { color: var(--red); font-weight: 700; }
  .status.busy { color: #7f8c9a; }

  footer { margin-top: 18px; text-align: center; font-size: 11px; color: #b7c1c9; }
</style>
</head>

const START_DATE = new Date(2026, 8, 1);

function getTodayQuestion() {
  const today = new Date();
  const s = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const idx = Math.round((t - s) / 86400000);
  return (idx >= 0 && idx < QOTD.length) ? QOTD[idx] : null;
}

function selectTab(cat) {
  currentCategory = cat;
  document.getElementById('tabBook').classList.toggle('active', cat === '책읽기');
  document.getElementById('tabQotd').classList.toggle('active', cat === 'QOTD');
  const qbox = document.getElementById('qbox');
  if (cat === 'QOTD') {
    const q = getTodayQuestion();
    if (q) {
      document.getElementById('qtag').textContent = '오늘의 질문';
      document.getElementById('qtext').textContent = q.en;
      document.getElementById('qkr').textContent = q.kr;
      const exEl = document.getElementById('qex');
      exEl.textContent = '';
      if (q.ex) {
        const b = document.createElement('b'); b.textContent = '이렇게 답해요';
        exEl.appendChild(b);
        exEl.appendChild(document.createTextNode(q.ex));
      }
      const shEl = document.getElementById('qshort');
      shEl.textContent = '';
      if (q.short) {
        const b2 = document.createElement('b'); b2.textContent = '짧은 버전';
        shEl.appendChild(b2);
        shEl.appendChild(document.createTextNode(q.short));
      }
      qbox.classList.add('show');
    } else {
      document.getElementById('qtag').textContent = '';
      document.getElementById('qtext').textContent = '오늘은 오늘의 질문 기간이 아니에요.';
      document.getElementById('qkr').textContent = '';
      document.getElementById('qex').textContent = '';
      document.getElementById('qshort').textContent = '';
      qbox.classList.add('show');
    }
  } else {
    qbox.classList.remove('show');
  }
  resetRecorder();
}

function resetRecorder() {
  document.getElementById('player').style.display = 'none';

  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('status').textContent = '';

  document.getElementById('timer').textContent = '00:00';
  audioBlob = null;
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');

  // ----- 녹음 시작 -----
  const name = document.getElementById('studentName').value.trim();
  if (!name) {
    setStatus('먼저 이름을 입력해주세요.', 'err');
    document.getElementById('studentName').focus();
    return;
  }

  // 환경 점검 (아무 반응 없이 멈추는 것 방지)
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('이 브라우저에서는 녹음을 쓸 수 없어요. 크롬 최신 버전에서 https 주소로 열어주세요.', 'err');
    return;
  }
  if (typeof MediaRecorder === 'undefined') {
    setStatus('이 브라우저가 녹음(MediaRecorder)을 지원하지 않아요. 크롬을 최신으로 업데이트해주세요.', 'err');
    return;
  }

  resetRecorder();
  btn.disabled = true;
  setStatus('마이크 사용을 "허용"해 주세요. (창 위쪽 주소창 근처에 작은 허용 창이 떠요)', 'busy');
  // 허용 창을 못 보고 멈춰있는 경우를 위한 안내
  const permHint = setTimeout(() => {
    setStatus('허용 창이 안 보이면: 주소창 왼쪽 자물쇠(🔒) 아이콘 → 마이크 → "허용" 으로 바꾸고 새로고침 해주세요.', 'busy');
  }, 7000);

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    clearTimeout(permHint);
    btn.disabled = false;
    let msg;
    if (err.name === 'NotAllowedError' || err.name === 'SecurityError')
      msg = '마이크 권한이 막혀 있어요. 주소창 왼쪽 자물쇠(🔒) → 마이크 → "허용" → 새로고침 해주세요.';
    else if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError')
      msg = '마이크를 찾지 못했어요. 헤드셋이 Windows 기본 입력 장치인지 확인해주세요. (설정 → 시스템 → 소리 → 입력에서 헤드셋 선택)';
    else if (err.name === 'NotReadableError' || err.name === 'AbortError')
      msg = '다른 프로그램이 마이크를 쓰고 있어요. 줌·화상영어·팀즈 등을 끄고 다시 눌러주세요.';
    else
      msg = '마이크 오류: ' + err.name + ' — ' + err.message;
    setStatus(msg, 'err');
    return;
  }
  clearTimeout(permHint);
  btn.disabled = false;

  try {
      chunks = [];
      const options = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {};
      mediaRecorder = new MediaRecorder(stream, options);
      mimeTypeUsed = mediaRecorder.mimeType || options.mimeType || 'audio/webm';
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(chunks, { type: mimeTypeUsed });
        const url = URL.createObjectURL(audioBlob);
        const player = document.getElementById('player');
        player.src = url;
        player.style.display = 'block';
        player.load();
        // Chrome·모바일: MediaRecorder 파일에 길이 정보가 빠져 있어
        // 재생 막대가 안 움직이고 소리가 안 나는 문제를 우회한다.
        player.onloadedmetadata = () => {
          if (!isFinite(player.duration)) {
            try {
              player.currentTime = 1e101;
              player.ontimeupdate = () => {
                player.ontimeupdate = null;
                if (isFinite(player.duration)) player.currentTime = 0;
              };
            } catch (e) { /* iOS 등 일부 환경은 seek 불가 — 재생은 그대로 가능 */ }
          }
        };
        player.onerror = () => {
          document.getElementById('status').textContent = '재생 오류가 났어요. 녹음은 저장됐으니 그대로 제출해도 됩니다. (' + (player.error && player.error.code) + ')';
          document.getElementById('status').className = 'status err';
        };
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('retryBtn').style.display = 'block';
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start(1000);
      startTime = Date.now();
      document.getElementById('timer').textContent = '00:00';
      timerInterval = setInterval(updateTimer, 200);
      btn.classList.add('recording');
      document.getElementById('recHint').textContent = '녹음 중입니다... 다시 누르면 멈춰요';
      setStatus('', '');
  } catch (err) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    setStatus('녹음 시작에 실패했어요: ' + err.name + ' — ' + err.message, 'err');
  }
}

function retryRecord() {
  // 이전 녹음 지우고 곧바로 새 녹음 시작
  resetRecorder();
  document.getElementById('recHint').textContent = '버튼을 눌러 녹음을 시작하세요';
  toggleRecord();
}

function updateTimer() {
  const sec = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  document.getElementById('timer').textContent = m + ':' + s;
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function submitRecording() {
  if (!audioBlob) return;
  const name = document.getElementById('studentName').value.trim();
  if (!name) { alert('이름을 먼저 입력해주세요!'); return; }

  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  submitBtn.disabled = true;
  statusEl.textContent = '전송 중입니다...';
  statusEl.className = 'status busy';

  const durationText = document.getElementById('timer').textContent.split(':');
  const durationSec = parseInt(durationText[0]) * 60 + parseInt(durationText[1]);

  try {
    const base64 = await blobToBase64(audioBlob);
    const payload = {
      studentName: name,
      category: currentCategory,
      audioBase64: base64,
      duration: durationSec,
      mimeType: mimeTypeUsed
    };
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (result.success) {
      statusEl.textContent = '제출 완료! 넌 역시 미라클 👍';
      statusEl.className = 'status ok';
      submitBtn.style.display = 'none';
      document.getElementById('retryBtn').style.display = 'none';
    } else {
      throw new Error(result.error || '알 수 없는 오류');
    }
  } catch (err) {
    statusEl.textContent = '전송 실패. 다시 시도해주세요. (' + err.message + ')';
    statusEl.className = 'status err';
    submitBtn.disabled = false;
  }
}

selectTab('책읽기');
</script>
